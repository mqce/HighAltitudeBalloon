<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Balloon Ground Station</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <section>
        <h2>状態</h2>
        <dl>
          <dt>サーバー</dt>
          <dd id="ws-status">接続中...</dd>
          <dt>シリアル</dt>
          <dd id="serial-status">-</dd>
          <dt>最終受信</dt>
          <dd id="last-rx">-</dd>
          <dt>受信 / 失敗</dt>
          <dd id="counts">-</dd>
        </dl>
      </section>

      <section>
        <h2>
          最新値
          <button id="copy-coords" type="button" disabled>座標コピー</button>
        </h2>
        <dl>
          <dt>時刻</dt>
          <dd id="v-time">-</dd>
          <dt>緯度</dt>
          <dd id="v-lat">-</dd>
          <dt>経度</dt>
          <dd id="v-lon">-</dd>
          <dt>高度</dt>
          <dd id="v-alt">-</dd>
          <dt>上昇速度</dt>
          <dd id="v-climb">-</dd>
          <dt>RSSI / SNR</dt>
          <dd id="v-signal">-</dd>
        </dl>
      </section>

      <section>
        <h2>高度</h2>
        <div id="alt-chart"></div>
      </section>

      <section id="raw-section">
        <h2>生データ</h2>
        <ol id="raw-list"></ol>
      </section>
    </aside>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/vendor/uplot/uPlot.iife.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
