; Ground station receiver: ESP32-C3 SuperMini + TLM922S-P01A
; Radio parameters must match pi/balloon.py.
;
;   pio run -t upload
;   pio device monitor

[env:ground]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLORA_RX_PIN=0
	-DLORA_TX_PIN=1
	-DP2P_FREQ_HZ=922500000
	-DP2P_SF=7
	-DP2P_BW=125
	-DP2P_PWR_DBM=14
