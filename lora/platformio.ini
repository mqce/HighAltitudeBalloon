; ESP32-C3 SuperMini + TLM922S-P01A P2P experiment
;
; Build / upload:
;   pio run -e balloon -t upload
;   pio run -e ground  -t upload
; Monitor:
;   pio device monitor -e balloon
;   pio device monitor -e ground

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLORA_RX_PIN=7
	-DLORA_TX_PIN=6
	-DP2P_FREQ_HZ=922500000
	-DP2P_SF=7
	-DP2P_BW=125
	-DP2P_PWR_DBM=14

[env:balloon]
build_src_filter = +<*> -<ground/>
build_flags =
	${env.build_flags}
	-DROLE_BALLOON

[env:ground]
build_src_filter = +<*> -<balloon/>
build_flags =
	${env.build_flags}
	-DROLE_GROUND
